name: Build iPhone-use high-quality low-latency unsigned runner IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-runner:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout visible host source
        uses: actions/checkout@v4
        with:
          path: custom-build

      - name: Checkout runner source
        uses: actions/checkout@v4
        with:
          repository: leeguooooo/iphone-use
          ref: v0.27.34
          path: iphone-use

      - name: Tune runner for high quality and low latency
        working-directory: iphone-use
        shell: bash
        run: |
          set -euo pipefail
          file=runner/IPhoneUseRunner/IPhoneUseRunnerUITests/RunnerH264.swift
          sed -i '' 's/var fps = 30/var fps = 60/' "$file"
          sed -i '' 's/var scalePercent = 50/var scalePercent = 75/' "$file"
          sed -i '' 's/var kbps = 1500/var kbps = 8000/' "$file"
          sed -i '' 's/var keyframeSeconds = 10.0/var keyframeSeconds = 2.0/' "$file"
          grep -nE 'var fps|scalePercent|var kbps|keyframeSeconds' "$file"

      - name: Build unsigned XCTest runner
        working-directory: iphone-use/runner/IPhoneUseRunner
        run: |
          xcodebuild build-for-testing             -project IPhoneUseRunner.xcodeproj             -scheme IPhoneUseRunner             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             IPHONEOS_DEPLOYMENT_TARGET=16.0

      - name: Package unsigned IPA
        working-directory: iphone-use/runner/IPhoneUseRunner
        run: |
          APP_PATH="$(find build/Build/Products -type d -name 'iPhoneUse-Runner.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          xcrun --sdk iphoneos clang \
            -fobjc-arc -arch arm64 -miphoneos-version-min=16.0 \
            custom-build/ios/VisibleRunnerHost.m \
            -framework UIKit -framework Foundation \
            -o "$APP_PATH/iPhoneUseRemote"
          chmod +x "$APP_PATH/iPhoneUseRemote"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable iPhoneUseRemote' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.leeguoo.iphone-use.remote' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string iPhone Use Remote' "$APP_PATH/Info.plist" || \
            /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName iPhone Use Remote' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :NSBonjourServices' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Add :NSBonjourServices array' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSBonjourServices:0 string _iphoneuse._tcp' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :NSLocalNetworkUsageDescription' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Add :NSLocalNetworkUsageDescription string Allow authenticated remote control over the local network or Tailscale.' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP_PATH/Info.plist"
          test -f "$APP_PATH/iPhoneUseRemote"
          test -f "$APP_PATH/PlugIns/iPhoneUse.xctest/iPhoneUse"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          lipo "$APP_PATH/iPhoneUseRemote" -verify_arch arm64
          lipo "$APP_PATH/PlugIns/iPhoneUse.xctest/iPhoneUse" -verify_arch arm64
          mkdir -p export/Payload
          cp -R "$APP_PATH" export/Payload/
          cd export
          zip -qry iphone-use-visible-runner-unsigned.ipa Payload
          unzip -tq iphone-use-visible-runner-unsigned.ipa
          shasum -a 256 iphone-use-visible-runner-unsigned.ipa > iphone-use-visible-runner-unsigned.ipa.sha256
          shasum -a 256 -c iphone-use-visible-runner-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: iphone-use-visible-runner-v0.27.34
          path: |
            iphone-use/runner/IPhoneUseRunner/export/iphone-use-visible-runner-unsigned.ipa
            iphone-use/runner/IPhoneUseRunner/export/iphone-use-visible-runner-unsigned.ipa.sha256

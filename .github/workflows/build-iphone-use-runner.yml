name: Build iPhone-use high-quality low-latency unsigned runner IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-runner:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout runner source
        uses: actions/checkout@v4
        with:
          repository: leeguooooo/iphone-use
          ref: v0.27.34
          path: iphone-use

      - name: Tune runner for high quality and low latency
        working-directory: iphone-use
        shell: bash
        run: |
          set -euo pipefail
          file=runner/IPhoneUseRunner/IPhoneUseRunnerUITests/RunnerH264.swift
          sed -i '' 's/var fps = 30/var fps = 60/' "$file"
          sed -i '' 's/var scalePercent = 50/var scalePercent = 75/' "$file"
          sed -i '' 's/var kbps = 1500/var kbps = 8000/' "$file"
          sed -i '' 's/var keyframeSeconds = 10.0/var keyframeSeconds = 2.0/' "$file"
          grep -nE 'var fps|scalePercent|var kbps|keyframeSeconds' "$file"

      - name: Enable inbound local-network access
        working-directory: iphone-use/runner/IPhoneUseRunner
        shell: bash
        run: |
          set -euo pipefail
          # The runner's NWListener binds all interfaces, but iOS local-network privacy
          # must be declared in the generated XCTest runner plist or inbound LAN/Tailscale
          # connections can be dropped before they reach the socket.
          sed -i '' 's/GENERATE_INFOPLIST_FILE: YES/GENERATE_INFOPLIST_FILE: YES\\n        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Allow authenticated remote control over the local network or Tailscale."/' project.yml
          sed -i '' '/GENERATE_INFOPLIST_FILE = YES;/a\\                INFOPLIST_KEY_NSLocalNetworkUsageDescription = "Allow authenticated remote control over the local network or Tailscale.";' IPhoneUseRunner.xcodeproj/project.pbxproj
          grep -n 'NSLocalNetworkUsageDescription' project.yml IPhoneUseRunner.xcodeproj/project.pbxproj

      - name: Build unsigned XCTest runner
        working-directory: iphone-use/runner/IPhoneUseRunner
        run: |
          xcodebuild build-for-testing             -project IPhoneUseRunner.xcodeproj             -scheme IPhoneUseRunner             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             IPHONEOS_DEPLOYMENT_TARGET=16.0

      - name: Package unsigned IPA
        working-directory: iphone-use/runner/IPhoneUseRunner
        run: |
          APP_PATH="$(find build/Build/Products -type d -name 'iPhoneUse-Runner.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/iPhoneUse-Runner"
          test -f "$APP_PATH/PlugIns/iPhoneUse.xctest/iPhoneUse"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          lipo "$APP_PATH/iPhoneUse-Runner" -verify_arch arm64
          lipo "$APP_PATH/PlugIns/iPhoneUse.xctest/iPhoneUse" -verify_arch arm64
          mkdir -p export/Payload
          cp -R "$APP_PATH" export/Payload/
          cd export
          zip -qry iphone-use-runner-high-quality-unsigned.ipa Payload
          unzip -tq iphone-use-runner-high-quality-unsigned.ipa
          shasum -a 256 iphone-use-runner-high-quality-unsigned.ipa > iphone-use-runner-high-quality-unsigned.ipa.sha256
          shasum -a 256 -c iphone-use-runner-high-quality-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: iphone-use-runner-high-quality-v0.27.34
          path: |
            iphone-use/runner/IPhoneUseRunner/export/iphone-use-runner-high-quality-unsigned.ipa
            iphone-use/runner/IPhoneUseRunner/export/iphone-use-runner-high-quality-unsigned.ipa.sha256

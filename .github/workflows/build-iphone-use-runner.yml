name: Build iPhone-use high-quality low-latency unsigned runner IPA

on:
  workflow_dispatch:
  push:
    branches: [main, swift-relay-fallback]

permissions:
  contents: read

jobs:
  build-runner:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout visible host source
        uses: actions/checkout@v4
        with:
          path: custom-build

      - name: Checkout runner source
        uses: actions/checkout@v4
        with:
          repository: leeguooooo/iphone-use
          ref: v0.27.34
          path: iphone-use

      - name: Record current Appium iOS compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p custom-build/build-metadata
          cat > custom-build/build-metadata/appium-ios-compatibility.json <<'JSON'
          {
            "xcuitestDriver": "13.5.0",
            "appium": "4.x",
            "webdriverAgent": "17.x",
            "remoteXpc": "6.1.4",
            "mediaProxy": "1.1.0",
            "realDeviceStream": "iOS/iPadOS 27+",
            "stream": "H.264 via Media Foundation on Windows",
            "verification": "dependency compatibility record only; physical-device streaming requires a connected device"
          }
          JSON
          python3 -m json.tool custom-build/build-metadata/appium-ios-compatibility.json

      - name: Tune runner for high quality and low latency
        working-directory: iphone-use
        shell: bash
        run: |
          set -euo pipefail
          file=runner/IPhoneUseRunner/IPhoneUseRunnerUITests/RunnerH264.swift
          sed -i '' 's/var fps = 30/var fps = 60/' "$file"
          sed -i '' 's/var scalePercent = [0-9][0-9]*/var scalePercent = 100/' "$file"
          sed -i '' 's/var kbps = 1500/var kbps = 10000/' "$file"
          sed -i '' 's/var keyframeSeconds = 10.0/var keyframeSeconds = 2.0/' "$file"
          sed -i '' 's/var mode = Mode.performance/var mode = Mode.quality/' "$file"
          grep -nE 'var fps|scalePercent|var kbps|keyframeSeconds|var mode' "$file"

      - name: Build unsigned XCTest runner
        working-directory: iphone-use/runner/IPhoneUseRunner
        run: |
          xcodebuild build-for-testing             -project IPhoneUseRunner.xcodeproj             -scheme IPhoneUseRunner             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             IPHONEOS_DEPLOYMENT_TARGET=16.0

      - name: Package unsigned IPA
        working-directory: iphone-use/runner/IPhoneUseRunner
        run: |
          exec > >(tee package.log) 2>&1
          APP_PATH="$(find build/Build/Products -type d -name 'iPhoneUse-Runner.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          TEST_RUNNER_PATH="$(find build/Build/Products -type d \( -name "*UITests-Runner.app" -o -name "*xctrunner.app" \) -print -quit)"
          test -n "$TEST_RUNNER_PATH"
          test -f "$TEST_RUNNER_PATH/Info.plist"
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -module-name iPhoneUseRemote \
            -parse-as-library \
            ../../../custom-build/ios/VisibleRunnerHost.swift \
            -framework UIKit -framework Foundation \
            -o "$APP_PATH/iPhoneUseRemote"
          file "$APP_PATH/iPhoneUseRemote"
          strings "$APP_PATH/iPhoneUseRemote" | grep -q 'ipu-visible-host-swift'
          chmod +x "$APP_PATH/iPhoneUseRemote"
          STARTUP_VIDEO="../../../custom-build/ios/assets/device-linked.mp4"
          if [ -f "$STARTUP_VIDEO" ]; then
            cp "$STARTUP_VIDEO" "$APP_PATH/device-linked.mp4"
          else
            echo "Startup video missing; the host will use its bounded UIKit animation."
          fi
          /usr/libexec/PlistBuddy -c 'Add :UIViewControllerBasedStatusBarAppearance bool true' "$APP_PATH/Info.plist" || \
            /usr/libexec/PlistBuddy -c 'Set :UIViewControllerBasedStatusBarAppearance true' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :UIStatusBarHidden bool true' "$APP_PATH/Info.plist" || \
            /usr/libexec/PlistBuddy -c 'Set :UIStatusBarHidden true' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable iPhoneUseRemote' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.leeguoo.iphone-use.remote' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string iPhone Use Remote' "$APP_PATH/Info.plist" || \
            /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName iPhone Use Remote' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :NSBonjourServices' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Add :NSBonjourServices array' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSBonjourServices:0 string _iphoneuse._tcp' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :NSLocalNetworkUsageDescription' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Add :NSLocalNetworkUsageDescription string Allow authenticated remote control over the local network or Tailscale.' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP_PATH/Info.plist"
          EXT_PATH="$APP_PATH/PlugIns/iPhoneUse.xctest"
          test -f "$EXT_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.leeguoo.iphone-use.remote.iPhoneUse' "$EXT_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT_PATH/Info.plist"
          test -f "$APP_PATH/iPhoneUseRemote"
          test -f "$EXT_PATH/iPhoneUse"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          lipo "$APP_PATH/iPhoneUseRemote" -verify_arch arm64
          lipo "$APP_PATH/PlugIns/iPhoneUse.xctest/iPhoneUse" -verify_arch arm64
          mkdir -p export/Payload
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.leeguoo.iphone-use.remote.xctrunner' "$TEST_RUNNER_PATH/Info.plist" || \
            /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.leeguoo.iphone-use.remote.xctrunner' "$TEST_RUNNER_PATH/Info.plist"
          cp -R "$APP_PATH" export/Payload/
          cp -R "$TEST_RUNNER_PATH" export/Payload/
          cd export
          zip -qry iphone-use-visible-runner-unsigned.ipa Payload
          unzip -tq iphone-use-visible-runner-unsigned.ipa
          shasum -a 256 iphone-use-visible-runner-unsigned.ipa > iphone-use-visible-runner-unsigned.ipa.sha256
          shasum -a 256 -c iphone-use-visible-runner-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          retention-days: 2
          name: iphone-use-visible-runner-v0.27.34
          path: |
            iphone-use/runner/IPhoneUseRunner/export/iphone-use-visible-runner-unsigned.ipa
            iphone-use/runner/IPhoneUseRunner/export/iphone-use-visible-runner-unsigned.ipa.sha256
            custom-build/build-metadata/appium-ios-compatibility.json

      - name: Upload package log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-log
          path: iphone-use/runner/IPhoneUseRunner/package.log
          if-no-files-found: warn
